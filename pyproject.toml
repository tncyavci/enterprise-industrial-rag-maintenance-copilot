[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-industrial-rag-maintenance-copilot"
version = "1.0.0"
description = "KVKK/GDPR PII-Redacting Hybrid RAG (BM25 + Dense RRF) & Vision Defect Triage Copilot for Enterprise Industrial & Financial Operations"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
industrial-copilot = "industrial_rag_copilot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
